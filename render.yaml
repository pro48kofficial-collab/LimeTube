services:
  - type: web
    name: limetube
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: limetube-db
          property: connectionString
      - key: OWNER_PASSWORD
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: MAX_FILE_SIZE_MB
        value: "500"
    disk:
      name: limetube-media
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: limetube-db
    plan: free

services:
  - type: web
    name: limetube
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: limetube-db-v4
          property: connectionString
      - key: OWNER_PASSWORD
        sync: false
      - key: MAX_FILE_SIZE_MB
        value: "100"

databases:
  - name: limetube-db-v4
    plan: free

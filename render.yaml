services:
  - type: web
    name: limetube
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: limetube-db
          property: connectionString
      - key: OWNER_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MAX_FILE_SIZE_MB
        value: "50"
databases:
  - name: limetube-db
    plan: free
